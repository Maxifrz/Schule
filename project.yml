# XcodeGen-Projektdefinition für BlueChat.
#
# Erzeugt eine .xcodeproj aus dieser Beschreibung – so bleibt die
# Projektkonfiguration als lesbarer, versionierbarer Text erhalten (statt
# als binärer pbxproj-Merge-Albtraum).
#
# Verwendung:
#   brew install xcodegen
#   xcodegen generate
#   open BlueChat.xcodeproj
#
# Das lokale Swift-Package BlueChatCore wird als Abhängigkeit eingebunden.

name: BlueChat
options:
  bundleIdPrefix: app.bluechat
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  BlueChatCore:
    path: BlueChatCore

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Datenbank/Dateien verschlüsselt-at-rest:
    # Schutzklasse wird zusätzlich über Entitlements/Default-Data-Protection gesetzt.

targets:
  BlueChat:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BlueChat
    info:
      path: BlueChat/App/Info.plist
    dependencies:
      - package: BlueChatCore
    settings:
      base:
        INFOPLIST_FILE: BlueChat/App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: app.bluechat
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        # SwiftData (@Model, @Query) und einige SwiftUI-APIs (z. B. zweiparametriges
        # onChange, symbolEffect) sind iOS-17-only und werden hier unbedingt genutzt –
        # daher Deployment-Target 17.0. Siehe README zur Versionsstrategie.
